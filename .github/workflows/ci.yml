name: CI

# Checks the code on every push to main and every pull request. Publishes nothing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (static export to out/)
        run: npm run build

      - name: Check the Cloudflare deploy (dry run)
        run: npx wrangler deploy --dry-run
