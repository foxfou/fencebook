name: Deploy

# Deploys to Cloudflare Workers. Runs ONLY when started manually (Actions -> Deploy -> Run workflow).
# Add these once in the repository (Settings -> Secrets and variables -> Actions):
#   secrets:   CLOUDFLARE_API_TOKEN (Workers and routes of your zone only), CLOUDFLARE_ACCOUNT_ID
#   variable:  SITE_URL, for example https://fencebook.funchosa.com (used for canonical and hreflang)
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
